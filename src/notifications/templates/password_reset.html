<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: sans-serif; line-height: 1.6; color: #333;">
    <h2>Reset Password</h2>
    <p>We received a request to reset the password for this account: <strong>{{ email }}</strong></p>
    <p>To set a new password, click the link (valid for 1 hour):</p>
    <p><a href="{{ reset_link }}" style="display: inline-block; padding: 10px 20px; background-color: #dc3545; color: #fff; text-decoration: none; border-radius: 5px;">Reset Password</a></p>
    <p>If you did not make this request, please ignore this email.</p>
</body>
</html>
